# =============================================================================
# paths.yaml - Single source of truth for every filesystem path.
#
# Values may contain ${TOKEN} placeholders. Tokens are resolved at runtime by
# scripts/project_setup.py using, in order of priority:
#
#   1. explicit keyword arguments passed in the notebook (notebook config cell)
#   2. environment variables (OSS_* / TOKEN_*)
#   3. the `tokens:` block below
#   4. the `${token}` spelling is resolved case-sensitively
#
# Any individual path can also be overridden with an environment variable of the
# form OSS_<SECTION>_<KEY>, e.g. OSS_PATHS_DATA_ROOT=/somewhere/else.
#
# Colab note: persistent data must live under the Google Drive mount, because
# /content is wiped whenever the runtime is recycled.
# =============================================================================

tokens:
  COLAB_BASE: /content
  DRIVE_MOUNT: /content/drive
  DRIVE_FOLDER: one-shot-segmentation
  REPO_ROOT: /content/one-shot-segmentation
  PROJECT_DIRNAME: one-shot-segmentation
  # DRIVE_ROOT is derived from `drive.root` at load time and can always be
  # overridden with the OSS_DRIVE_ROOT environment variable.
  DRIVE_ROOT: ${DRIVE_MOUNT}/MyDrive/${DRIVE_FOLDER}

# Where the Drive folder itself lives, e.g. /content/drive/MyDrive/one-shot-segmentation
# DRIVE_FOLDER is relative to the MyDrive root so the config survives users who
# organise their Drive differently.
project:
  name: robust-one-shot-instance-segmentation
  repo_dirname: one-shot-segmentation
  repo_url: https://github.com/BellilxDhaker/cvision.git
  repo_branch: main
  drive_folder: ${DRIVE_FOLDER}
  paths_config: configs/paths.yaml

drive:
  mount_point: ${DRIVE_MOUNT}
  mydrive: ${DRIVE_MOUNT}/MyDrive
  root: ${DRIVE_MOUNT}/MyDrive/${DRIVE_FOLDER}

# All heavy artefacts (datasets, checkpoints, feature caches, results).
paths:
  data_root: ${DRIVE_ROOT}/data
  raw_root: ${DRIVE_ROOT}/data/raw
  processed_root: ${DRIVE_ROOT}/data/processed
  cache_root: ${DRIVE_ROOT}/data/cache
  splits_root: ${DRIVE_ROOT}/data/splits

  checkpoints_root: ${DRIVE_ROOT}/checkpoints

  results_root: ${DRIVE_ROOT}/results
  results_baseline: ${DRIVE_ROOT}/results/baseline
  results_robustness: ${DRIVE_ROOT}/results/robustness
  results_proposed: ${DRIVE_ROOT}/results/proposed
  results_ablation: ${DRIVE_ROOT}/results/ablation
  results_final: ${DRIVE_ROOT}/results/final

  logs_root: ${DRIVE_ROOT}/logs
  env_reports_root: ${DRIVE_ROOT}/results/environment

# Sub-layout of the feature cache. One directory per (model, preprocessing)
# combination so a changed backbone or input resolution can never silently
# collide with previously cached tensors.
cache:
  version: 1
  root: ${DRIVE_ROOT}/data/cache
  dino_v2_root: ${DRIVE_ROOT}/data/cache/dinov2
  extensions: [.pt]

# Where packages are installed / caches kept inside the ephemeral container.
runtime:
  hf_home: /root/.cache/huggingface
  torch_home: /root/.cache/torch
  clone_root: ${COLAB_BASE}/${PROJECT_DIRNAME}

# ---------------------------------------------------------------------------
# Resource expectations. Used by scripts/environment_check.py to decide whether
# the selected Colab runtime is sufficient. Thresholds are intentionally
# generic; Phase 0 only needs a modern CUDA GPU with a few GB of VRAM.
# ---------------------------------------------------------------------------
resources:
  min_vram_gb: 8.0        # hard requirement for this project
  recommended_vram_gb: 15.0  # GPU with more memory is preferable for later phases
  min_system_ram_gb: 12.0
  min_free_disk_gb: 20.0  # free space on the Drive mount

# Placeholders kept for later phases; nothing is downloaded in Phase 0.
models:
  dinov2:
    default: facebook/dinov2-base
    feature_cache_root: ${DRIVE_ROOT}/data/cache/dinov2
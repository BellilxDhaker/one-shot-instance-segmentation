# =============================================================================
# paths.yaml - filesystem layout and runtime defaults for Phase 1.
#
# Relative paths are resolved against the project root (the folder holding this
# repository). In Colab the project root is the notebook bundle directory, so the
# same config works locally and remotely. Every value can be overridden with an
# environment variable of the form OSS_<SECTION>_<KEY>, e.g.
# OSS_PATHS_DATASETS_ROOT=/content/datasets.
# =============================================================================

project:
  name: one-shot-instance-segmentation
  phase: 1
  notebook: notebooks/02_one_shot_pipeline.ipynb

paths:
  # User-provided reference/target pairs and the evaluation manifest.
  data_root: data
  cases_manifest: data/cases.json
  # The synthetic demo pair, written by tools/make_demo_pair.py.
  demo_root: data
  # Few-shot segmentation datasets, see tools/download_datasets.py.
  datasets_root: datasets
  downloads_root: datasets/downloads
  # Downloaded or user-supplied weights; the two checkpoints below are pulled
  # from the Hugging Face hub into the runtime cache unless cache_dir is set.
  checkpoints_root: checkpoints
  # Predicted masks, similarity maps, figures and JSON summaries.
  results_root: results
  experiments_root: experiments
  logs_root: logs

datasets:
  coco20i: datasets/COCO2014
  fss1000: datasets/FSS-1000
  lvis: datasets/LVIS
  paco: datasets/PACO-Part
  pascal: datasets/Pascal-Part

# Frozen pretrained models. Both are loaded through `transformers`, never cloned
# from an external repository, and are used with eval() and requires_grad_(False).
models:
  feature_encoder:
    id: facebook/dinov2-base
    layer: -1                 # last transformer block
    max_size: 518             # longest side of the encoder input, in pixels
    image_size: null          # null keeps the aspect ratio, rounded to a patch
    normalise: true           # L2-normalise tokens so cosine = dot product
    dtype: float32
  segmenter:
    id: facebook/sam-vit-base
    multimask_output: true    # keep the highest scoring of SAM's three masks
    dtype: float32

# Stage defaults. OneShotPipeline accepts all of these as keyword arguments, so
# this block documents the values the notebook and any script start from.
pipeline:
  min_coverage: 0.5           # patch share needed to count as reference object
  aggregate: both             # max + prototype correspondence, averaged
  localization:
    threshold: 0.5
    min_area_fraction: 0.002
    closing: 7                # morphological closing side, in pixels
    opening: 0
    max_candidates: 5
  smoothing_sigma: 1.5        # Gaussian smoothing of the similarity map
  clip_percentile: 99.0
  min_percentile: 1.0

evaluation:
  metrics: [iou, dice, precision, recall]

runtime:
  device: auto                # cuda when available, else cpu
  cache_dir: checkpoints      # null keeps the default Hugging Face cache
  download_datasets: false    # the notebook never downloads data unless asked
